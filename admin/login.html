<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>body{background:#f3f4f6} .card{border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.06)}</style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card p-4" style="width: 380px;">
    <h4 class="mb-3 text-center">东泓国季 · 管理台</h4>
    <div id="msg" class="alert alert-danger d-none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input class="form-control" name="username" placeholder="admin" required />
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" class="form-control" name="password" placeholder="admin123" required />
      </div>
      <button class="btn btn-primary w-100" type="submit">登录</button>
    </form>
    <div class="text-muted small mt-3">默认账号：admin / admin123</div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.add('d-none');
      const fd = new FormData(form);
      const username = fd.get('username');
      const password = fd.get('password');
      if (username === 'admin' && password === 'admin123') {
        let ip = 'unknown';
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          ip = data.ip || 'unknown';
        } catch (e) {}
        const loginAt = new Date().toLocaleString();
        localStorage.setItem('adminLogin', JSON.stringify({ username, loginAt, ip }));
        location.href = 'index.html';
      } else {
        msg.textContent = '用户名或密码错误';
        msg.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
